<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Web App</title>
    <link rel="stylesheet" href="style/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
  <div id="page">
      <div class="logo">
        <p>WeatherAt</p>
      </div>
    <section class="top">
      <div class="bar">
          <div class="error" style="display: none"></div>
        <form class="search-form">
          <input type="text" class="input-city" placeholder="Enter City Name" />
          <button type="submit" class="search-btn">Search</button>
        </form>
          <div class="place"></div>
      </div>
    </section>
    <section class="current-weather">
      <div class="temp-details">
        <div class="temp-box">
          <img src="images/thermometer.png" alt="" class="thermometer" />
          <div class= "temp1"></div>
        </div>
        <div class="cloud-box">
          <div class="weatherimage"><img src="images/weather.gif" alt="" class="cloud-img" /></div>
        <div class="cloud-desc-box">
          <img src="images/product-description.png" alt="" class="desc-img" />
          <div class="desc"></div>
        </div>
        </div>
      </div>

      <div class = "accessories">
      <div class="hum-desc">
        <div class="box1">
          <img src="images/wind.gif" alt="" class="wind-speed-img">
        <div class="air"></div>
      </div>
        <div class="box2">
          <img src="images/water-drops.gif" alt="" class="humidity-img" />
          <div class="water"></div>
        </div>
        
        <div class="box3">
          <img src="images/gauge.png" alt="" class="gauge">
        <p class="rainguage"></p></div>
        <div class="box4">
          <img src="images/radiator.png" alt="" class="radiator">
        <p class="weather-rad"></p></div>
      </div>
      <div class="location-sec">
      <div class="other-locations">
        <div class="location l1">
        </div>
        <div class="location l2">

        </div>
        <div class="location l3">

        </div>
        <div class="location l4"></div>
        <div class="location l5"></div>
        <div class="location l6"></div>
      </div>
      </div>
    </div>
    
    </section>
</div>
    <script src="script/script.js"></script>
  </body>
</html>
